[workspace]
resolver = "2"
members = [
    "crates/edgechain-core",
    "crates/edgechain-model",
    "crates/edgechain-memory",
    "crates/edgechain-rag",
    "crates/edgechain-plugin",
    "bindings/flutter/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["EdgeChain Contributors"]
repository = "https://github.com/edgechain-org/edgechain"
homepage = "https://github.com/edgechain-org/edgechain"
keywords = ["agent", "llm", "edge", "mobile", "offline"]
categories = ["api-bindings", "embedded"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database
rusqlite = { version = "0.31", features = ["bundled", "sqlcipher"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
