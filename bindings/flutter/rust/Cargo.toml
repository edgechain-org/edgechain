[package]
name = "edgechain-flutter-bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "edgechain_flutter_bridge"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
once_cell = "1"

edgechain-core = { path = "../../../crates/edgechain-core" }
edgechain-model = { path = "../../../crates/edgechain-model" }
edgechain-memory = { path = "../../../crates/edgechain-memory" }
edgechain-rag = { path = "../../../crates/edgechain-rag" }
edgechain-plugin = { path = "../../../crates/edgechain-plugin" }
