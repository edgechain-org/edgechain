name: edgechain_flutter
description: Flutter binding for EdgeChain — local-first agent runtime for offline devices.
version: 0.1.0
homepage: https://github.com/edgechain-org/edgechain

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.0.0
  path_provider: ^2.1.0
  sqflite: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.edgechain.flutter
        pluginClass: EdgechainFlutterPlugin
      ios:
        pluginClass: EdgechainFlutterPlugin
